name: Deploy Scraping API

on:
  push:
    branches:
      - main

concurrency:
  group: scraping-api-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      TASK_FAMILY: ${{ secrets.TASK_FAMILY }}
      # Serviço dedicado à fila do TRT3 (WORKER_QUEUE_MODE=trt3-only). Roda a
      # mesma imagem, com task definition própria — sem estes dois, ele ficava
      # para trás a cada deploy e seguia com código antigo.
      ECS_SERVICE_TRT3: ${{ secrets.ECS_SERVICE_TRT3 }}
      TASK_FAMILY_TRT3: ${{ secrets.TASK_FAMILY_TRT3 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate TRT3 service config
        run: |
          set -euo pipefail

          if [[ -z "${{ env.ECS_SERVICE_TRT3 }}" || -z "${{ env.TASK_FAMILY_TRT3 }}" ]]; then
            echo "ECS_SERVICE_TRT3 e TASK_FAMILY_TRT3 precisam estar configurados."
            echo "Sem eles o serviço dedicado ao TRT3 nao e atualizado e fica com codigo antigo."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}
          IMAGE_LATEST=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

          docker build -t $IMAGE_URI -t $IMAGE_LATEST .
          docker push --all-tags ${ECR_REGISTRY}/${ECR_REPOSITORY}

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Validate Redis URL (fail fast)
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.REDIS_URL_FINGERPRINT }}" ]]; then
            echo "REDIS_URL_FINGERPRINT not configured"
            exit 1
          fi

          REDIS_URL=$(aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.AWS_SECRET_ID }} \
            --query SecretString \
            --output text | jq -r .REDIS_URL)

          if [[ -z "$REDIS_URL" || "$REDIS_URL" == "null" ]]; then
            echo "Failed to fetch REDIS_URL from Secrets Manager"
            exit 1
          fi

          if [[ "$REDIS_URL" != *"${{ secrets.REDIS_URL_FINGERPRINT }}"* ]]; then
            echo "INVALID REDIS_URL detected!"
            exit 1
          fi

      - name: Render Task Definition (principal)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TASK_FAMILY: ${{ env.TASK_FAMILY }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          NODE_ENV: production
          # 'all' preserva o comportamento historico deste servico (consome as
          # 25 filas). Trocar para 'exclude-trt3' quando quiser que a fila do
          # TRT3 seja atendida so pelo servico dedicado.
          WORKER_QUEUE_MODE: ${{ secrets.WORKER_QUEUE_MODE || 'all' }}
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN }}
          SECRET_ARN_PREFIX: ${{ secrets.SECRET_ARN_PREFIX }}
          LOG_GROUP: ${{ secrets.LOG_GROUP }}
        run: node ./scripts/render-task-definition.mjs task-def-rendered.json

      - name: Deploy ECS (principal)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-def-rendered.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render Task Definition (TRT3)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TASK_FAMILY: ${{ env.TASK_FAMILY_TRT3 }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          NODE_ENV: production
          WORKER_QUEUE_MODE: trt3-only
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN }}
          SECRET_ARN_PREFIX: ${{ secrets.SECRET_ARN_PREFIX }}
          LOG_GROUP: ${{ secrets.LOG_GROUP }}
        run: node ./scripts/render-task-definition.mjs task-def-trt3-rendered.json

      - name: Deploy ECS (TRT3)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-def-trt3-rendered.json
          service: ${{ env.ECS_SERVICE_TRT3 }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
